name: CI

on:
  push:
    paths-ignore:
      - deals.json
      - gems.json
      - soldmedians.json
      - state-seed.json
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - name: Install watcher dependencies
        run: npm ci
      - name: Run unit and integration tests
        run: npm run selftest
      - name: Audit watcher dependencies
        run: npm audit
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Audit dashboard dependencies
        working-directory: dashboard
        run: npm audit

  package-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Build Windows installer
        working-directory: dashboard
        run: npm run build
      - name: Verify installer and packaged application resources
        working-directory: dashboard
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "dist/Discogs-Deal-Shark-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Missing Windows installer: $installer"
          }
          node verify-package.cjs `
            'dist/win-unpacked/resources/app.asar' `
            'dist/win-unpacked/resources/watcher'
      - name: Upload tested Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-ci
          path: dashboard/dist/Discogs-Deal-Shark-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build cloud watcher image
        run: docker build --tag discogs-deal-shark:ci .
