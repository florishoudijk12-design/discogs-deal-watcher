name: CI

on:
  push:
    paths-ignore:
      - deals.json
      - gems.json
      - soldmedians.json
      - state-seed.json
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - name: Install watcher dependencies
        run: npm ci
      - name: Run unit and integration tests
        run: npm run selftest
      - name: Audit watcher dependencies
        run: npm audit
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Audit dashboard dependencies
        working-directory: dashboard
        run: npm audit

  package-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Build unpacked Windows app
        working-directory: dashboard
        run: npm run build:dir
      - name: Verify packaged application resources
        working-directory: dashboard
        shell: pwsh
        run: |
          $required = @(
            'engine.js', 'discogs.js', 'store.js', 'mailer.js', 'telegram.js',
            'delivery.js', 'server.js', 'watcher.js', 'node_modules/nodemailer/package.json'
          )
          foreach ($file in $required) {
            $path = Join-Path 'dist/win-unpacked/resources/watcher' $file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing packaged watcher resource: $file" }
          }
          @'
          const asar = require('@electron/asar');
          const files = asar.listPackage('dist/win-unpacked/resources/app.asar');
          for (const wanted of ['\\main.js', '\\scan-policy.js', '\\git-policy.js', '\\runtime-policy.js', '\\median-publisher.js', '\\preload.js', '\\renderer.js']) {
            if (!files.includes(wanted)) throw new Error('Missing from app.asar: ' + wanted);
          }
          console.log('Packaged resources: OK');
          '@ | node -

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build cloud watcher image
        run: docker build --tag discogs-deal-watcher:ci .
